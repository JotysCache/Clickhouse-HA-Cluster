# Name = cloud VM name = hostname = SSH alias (~/.ssh/config) = ClickHouse replica name.
#   ansible_host : SSH alias; DB nodes are private and reached via ProxyJump chpoc-app
#   private_ip   : VPC address the nodes use to talk to each other
#   keeper_id    : unique Raft id, 1..3, never reuse or change after first deploy
[clickhouse]
chpoc-1 ansible_host=chpoc-1 private_ip=10.107.40.5 keeper_id=1
chpoc-2 ansible_host=chpoc-2 private_ip=10.107.40.6 keeper_id=2
chpoc-3 ansible_host=chpoc-3 private_ip=10.107.40.7 keeper_id=3

# Application / test client: runs the hatest workload inside the VPC, SSH jump host.
[client]
chpoc-app ansible_host=chpoc-app private_ip=10.107.40.8

[all:vars]
ansible_user=chadmin
